<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مسابقة الخريدة البهية</title>
<style>
:root{--bg:#e8f3f1;--card:#ffffff;--ink:#12303a;--muted:#587a80;--green:#0f6b57;--green2:#1c9a7a;--blue:#17507a;--blue2:#2b78a8;--gold:#c9a24a;--red:#b3402f;--line:#bfdcd5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) radial-gradient(circle at 20px 20px,rgba(28,154,122,.10) 2px,transparent 3px) 0 0/40px 40px;color:var(--ink);font-family:'Noto Naskh Arabic','Traditional Arabic','Amiri',Tahoma,Arial,sans-serif;font-size:18px;line-height:1.8}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{text-align:center;padding:20px 12px 18px;margin:0 -16px 6px;background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;border-bottom:5px solid var(--gold);border-radius:0 0 28px 28px;box-shadow:0 4px 12px rgba(23,80,122,.25)}
header .bsm{font-size:20px;color:#f2dca0;margin-bottom:4px}
header h1{margin:0;font-size:32px;color:#fff}
header p{margin:4px 0 0;color:#d6efe8;font-size:16px}
.namebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.namebox label{font-weight:bold;color:var(--blue)}
.namebox input{flex:1;min-width:160px;font-family:inherit;font-size:20px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;color:var(--ink);background:#f7fcfb}
.namebox input:focus{outline:none;border-color:var(--green2)}
.who{text-align:center;color:var(--blue);font-weight:bold;font-size:22px}
button.wa{background:#1f9d55}
.card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--green2);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.stage{display:flex;align-items:center;gap:12px;cursor:pointer}
.stage.locked{opacity:.55;cursor:not-allowed}
.num{flex:0 0 46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--green));border:2px solid var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold}
.stage.locked .num{background:var(--muted)}
.stage h3{margin:0;font-size:19px}
.stage small{color:var(--muted);display:block;font-size:15px;line-height:1.5}
.best{margin-right:auto;text-align:center;font-size:14px;color:var(--gold);white-space:nowrap}
button{font-family:inherit;font-size:19px;border:0;border-radius:12px;padding:13px 20px;cursor:pointer;background:linear-gradient(135deg,var(--blue),var(--green));color:#fff}
button.sec{background:#dcebe7;color:var(--ink)}
button:disabled{opacity:.5;cursor:default}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--green2);width:0;transition:width .3s}
.top{display:flex;justify-content:space-between;color:var(--muted);font-size:16px}
.q{font-size:23px;font-weight:bold;margin:6px 0 16px;color:var(--blue);line-height:1.9}
.opt{display:block;width:100%;text-align:right;background:#f4fbf9;color:var(--ink);border:3px solid #8fc7ba;margin:12px 0;padding:18px 16px;min-height:68px;border-radius:16px;font-size:22px;font-weight:bold;line-height:1.7;box-shadow:0 2px 0 #8fc7ba}
.opt:hover:not(:disabled){border-color:var(--blue2);background:#e6f2f9}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.opt.ok{background:#d3f1e1;border-color:#1c9a56;box-shadow:0 2px 0 #1c9a56}
.opt.bad{background:#fbdcd6;border-color:var(--red);box-shadow:0 2px 0 var(--red)}
.opt:disabled{opacity:1;cursor:default}
.exp{background:#fdf6df;border-right:4px solid var(--gold);padding:10px 12px;border-radius:8px;margin:12px 0;font-size:17px}
.score{font-size:58px;color:var(--green);text-align:center;margin:0}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.rev{border-bottom:1px solid var(--line);padding:10px 0;font-size:17px}
.rev:last-child{border:0}
.rev b{color:var(--red)} .rev span{color:var(--green)}
.hide{display:none}
footer{text-align:center;color:#fff;font-size:17px;padding:16px 10px;margin:18px -16px 0;background:linear-gradient(135deg,var(--blue),var(--green));border-top:4px solid var(--gold);border-radius:24px 24px 0 0}
footer small{display:block;color:#d6efe8;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="bsm">بسم الله الرحمن الرحيم</div>
<h1>مسابقة الخريدة البهية</h1>
<p>في علم التوحيد — للإمام أحمد بن محمد الدردير</p>
</header>

<div id="home">
<div class="card namebox"><label for="pname">اسم الطالب:</label><input id="pname" type="text" maxlength="40" placeholder="اكتب اسمك هنا" autocomplete="name"></div>
<div class="card center" style="font-size:16px;color:var(--muted)">اكتب اسمك ثم اختر المرحلة. ست مراحل، في كل مرحلة 20 سؤالاً بأربعة خيارات. يُفتح كل مرحلة جديدة بتحقيق 14 من 20 على الأقل.</div>
<div id="stages"></div>
<div class="center"><button class="sec" id="unlockAll" style="font-size:15px;padding:8px 14px">فتح جميع المراحل</button> <button class="sec" id="resetAll" style="font-size:15px;padding:8px 14px">مسح النتائج</button></div>
</div>

<div id="quiz" class="hide">
<div class="card">
<div class="top"><span id="qStage"></span><span id="qCount"></span></div>
<div class="bar"><i id="bar"></i></div>
<div class="q" id="qText"></div>
<div id="opts"></div>
<div class="exp hide" id="exp"></div>
<div class="row"><button id="next" class="hide">التالي</button><button class="sec" id="quit">الرئيسية</button></div>
</div>
</div>

<div id="result" class="hide">
<div class="card">
<div class="who" id="rWho"></div>
<h2 class="center" id="rTitle" style="margin:0"></h2>
<p class="score" id="rScore"></p>
<p class="center" id="rMsg"></p>
<div class="row" id="rBtns"></div>
</div>
<div class="card hide" id="rvCard"><h3 style="margin-top:0">مراجعة الأسئلة التي أخطأت فيها</h3><div id="rv"></div></div>
</div>
<footer>إعداد وبرمجة وائل دهشان<small>اللهم انفعنا بما علمتنا</small></footer>
</div>

<script>
// كل سؤال: [السؤال، الجواب الصحيح، خطأ1، خطأ2، خطأ3، التوضيح]
var STAGES=[
{t:"المرحلة الأولى: المقدمة وأقسام الحكم العقلي",d:"الأبيات 1 – 16",q:[
["من مؤلف منظومة «الخريدة البهية» في علم التوحيد؟","الإمام أحمد بن محمد الدردير","الإمام محمد بن يوسف السنوسي","الإمام أبو حامد الغزالي","الإمام أحمد بن محمد الصاوي","صرّح الناظم باسمه في أول القصيدة: «أي أحمد المشهور بالدردير»."],
["ماذا يعني قول الناظم عن نفسه: «راجي رحمة القدير»؟","أنه يطلب رحمة الله القدير ويرجوها","أنه يخاف من الله ولا يرجو رحمته","أنه يمدح نفسه بالقدرة على كل شيء","أنه يشكو من ضعف علمه فقط","وصف نفسه بالفقر إلى رحمة ربه تواضعاً وأدباً في مطلع الكتاب."],
["أيّ الصفات الآتية لم يذكرها الناظم في حمد الله في البيت الثاني «الحمد لله العلي الواحد...»؟","الرحيم","الفرد","الغني","الماجد","ذكر في البيت: العلي، الواحد، العالم، الفرد، الغني، الماجد."],
["من الصحابي الذي خصّه الناظم بالذكر في قوله «لاسيما رفيقه في الغار»؟","أبو بكر الصديق رضي الله عنه","عمر بن الخطاب رضي الله عنه","عثمان بن عفان رضي الله عنه","علي بن أبي طالب رضي الله عنه","رفيق النبي ﷺ في غار ثور عند الهجرة هو أبو بكر الصديق."],
["ما اسم المنظومة التي سمّاها الناظم؟","الخريدة البهية","جوهرة التوحيد","السنوسية الكبرى","تحفة المريد","قال: «سميتها الخريدة البهية»."],
["ما معنى قوله عن عقيدته: «لطيفة صغيرة في الحجم لكنها كبيرة في العلم»؟","قليلة الألفاظ والأبيات عظيمة الفائدة والمعاني","كثيرة الأبيات ضعيفة الفائدة","صغيرة الفائدة لأنها قصيرة","لا تحتاج إلى فهم ولا إلى شرح","حجمها صغير وما فيها من علم عظيم جامع."],
["ماذا يقصد الناظم بقوله «لأنها بزبدة الفن تفي»؟","أنها تشتمل على خلاصة علم التوحيد وتكفي من أراد الاكتفاء","أنها تذكر الخلافات كلها بالتفصيل","أنها خاصة بالمبتدئين ولا تغني أحداً","أنها لا تتعرض إلا للأدلة النقلية","الزبدة هي خلاصة الشيء؛ فالمنظومة خلاصة هذا العلم."],
["أيّ مما يأتي لم يطلبه الناظم من الله في البيت الثامن؟","الشهرة بين الناس","قبول العمل","النفع بالمنظومة","مغفرة الزلل","رجا قبول العمل والنفع بها ومغفرة الزلل، ولم يطلب شهرة."],
["كم قسماً لحكم العقل ذكر الناظم؟","ثلاثة","اثنان","أربعة","خمسة","الوجوب، والاستحالة، والجواز."],
["أيّ الأقسام الآتية وصفه الناظم بأنه «ثالث الأقسام»؟","الجواز","الوجوب","الاستحالة","العادة","ترتيبها في النظم: الوجوب ثم الاستحالة ثم الجواز."],
["ما الواجب الذي بدأ به الناظم على المكلف شرعاً؟","معرفة الله تعالى","جمع المال","طلب الشهرة","حفظ الأنساب","«وواجب شرعاً على المكلف معرفة الله العلي»."],
["ماذا تشمل معرفة الله الواجبة على المكلف؟","معرفة ما يجب في حقه وما يستحيل وما يجوز","معرفة كيفية ذاته سبحانه","معرفة أسماء ملوك الأرض","معرفة وقت قيام الساعة","«أي يعرف الواجب والمحال مع جائز في حقه تعالى»."],
["ما حكم معرفة ما يجب ويستحيل ويجوز في حق الرسل عليهم السلام؟","واجبة مثل معرفتها في حق الله تعالى","مستحبة فقط","جائزة لمن أراد","غير مطلوبة","«ومثل ذا في حق رسل الله عليهم تحية الإله»."],
["ما تعريف «الواجب العقلي» في القصيدة؟","ما لا يقبل الانتفاء في ذاته","ما يقبل الثبوت والانتفاء","ما لا يقبل الثبوت في ذاته","ما أمر به الشرع فقط","«فالواجب العقلي ما لم يقبل الانتفا في ذاته»."],
["ما تعريف «المستحيل» العقلي؟","ما لا يقبل الثبوت في ذاته","ما لا يقبل الانتفاء في ذاته","ما يقبل الوجود والعدم","ما لم يره أحد","المستحيل ضد الواجب: لا يقبل الثبوت أبداً."],
["أيّ الأمثلة الآتية «جائز» عقلاً؟","وجود إنسان معيّن (يمكن أن يوجد وألا يوجد)","وجود الله تعالى","وجود شريك لله","اتصاف الله بالقدرة","الجائز ما يقبل الثبوت والانتفاء معاً."],
["ما حكم العقل في وجود شريك لله تعالى؟","مستحيل","واجب","جائز","جائز لكنه لم يقع","لأن الشريك لا يقبل الثبوت في ذاته."],
["ما حكم العقل في أن يرسل الله رسولاً إلى قوم؟","جائز","واجب على الله","مستحيل","مستحيل لأن الله لا يتكلم","الإرسال تفضل ورحمة وليس واجباً عقلاً."],
["ما حكم العقل في قولنا «الله موجود»؟","واجب","جائز","مستحيل","مشكوك فيه","وجوده تعالى واجب عقلاً لا يقبل الانتفاء."],
["لماذا بدأ الناظم بأقسام الحكم العقلي قبل ذكر الصفات؟","لأن معرفة الصفات تُبنى على التمييز بين الواجب والمستحيل والجائز","لأن العقل لا يُعتمد عليه أبداً","لأن الصفات لا علاقة لها بهذه الأقسام","ليملأ عدد الأبيات","كل ما يُذكر بعد ذلك يُنسب إلى واحد من هذه الأقسام الثلاثة."]
]},
{t:"المرحلة الثانية: حدوث العالم والصفات النفسية والسلبية",d:"الأبيات 17 – 29",q:[
["ما المقصود بـ«العالَم» في قول الناظم «أي ما سوى الله العلي العالما»؟","كل ما سوى الله تعالى","المخلوقات العاقلة فقط","الأرض وحدها","الإنس والجن فقط","العالم: ما سوى الله من الذوات والأعراض."],
["ما حكم العالم عند الناظم من حيث الحدوث والقدم؟","حادث مفتقر إلى مُحدِث","قديم لا أول له","قديم الذات حادث الصفات","لا يمكن الحكم عليه","«من غير شك حادث مفتقر»."],
["بأي دليل استدل الناظم على حدوث العالم؟","بقيام التغيّر به","بكثرة المخلوقات","بتعدد الأمم","بأقوال الفلاسفة","«لأنه قام به التغير»؛ وما قام به التغير لا يكون قديماً."],
["ما معنى «الحدوث» كما عرّفه الناظم؟","وجود بعد عدم","وجود لا أول له","عدم بعد وجود","وجود لا آخر له","«حدوثه وجوده بعد العدم»."],
["ما ضد الحدوث الذي سمّاه الناظم؟","القِدَم","البقاء","الفناء","الوحدانية","«وضده هو المسمى بالقدم»."],
["ما الصفة الأولى الواجبة لله والتي ذكرها الناظم بقوله «الوصف بالوجود»؟","الوجود","القدم","الحياة","الغِنى","«فاعلم بأن الوصف بالوجود من واجبات الواحد المعبود»."],
["ماذا يعني قوله «ظاهر بأن كل أثر يهدي إلى مؤثر فاعتبر»؟","أن كل مخلوق يدل على وجود خالق أوجده","أن الأثر يُغني عن المؤثر","أن العالم أوجد نفسه","أن المؤثر قد لا يكون موجوداً","هذا دليل وجوده تعالى: العالم أثر ولا بد له من مؤثر."],
["إلى أي نوع من الصفات تنتمي صفة الوجود؟","الصفة النفسية","الصفة السلبية","صفة المعاني","الصفة المعنوية","«وذي تسمى صفة نفسية»."],
["كم عدد الصفات السلبية التي ذكرها الناظم؟","خمس","ثلاث","سبع","ثماني","«ثم تليها خمسة سلبية»."],
["أيّ الصفات الآتية ليست من الصفات السلبية الخمس؟","القدرة","القِدَم","البقاء","الوحدانية","القدرة من صفات المعاني، أما السلبية فهي: القدم والبقاء والمخالفة للحوادث والقيام بالنفس والوحدانية."],
["ما معنى «القدم» في حق الله تعالى؟","أنه موجود لا أول لوجوده","أنه موجود لا آخر لوجوده","أنه لا يشبه شيئاً","أنه لا يحتاج إلى مخصص","القدم: عدم الأولية، أي لا بداية لوجوده."],
["ما معنى «البقاء» في حق الله تعالى؟","أن وجوده لا آخر له","أن وجوده لا أول له","أنه لا يحتاج إلى أحد","أنه واحد لا شريك له","البقاء: عدم الآخرية، فلا يلحقه فناء."],
["ما معنى «قيامه بنفسه» سبحانه؟","أنه لا يحتاج إلى محل يحل فيه ولا إلى مخصص يخصصه","أنه يقوم الليل","أنه لا يشبه شيئاً","أنه واحد في أفعاله","«قيامه بنفسه نلت التقى»: غناه المطلق عن المحل والمخصص."],
["ما معنى «تخالف للغير» أي مخالفته تعالى للحوادث؟","أنه لا يشبه شيئاً من مخلوقاته","أنه لا يعلم غيره","أنه لا يرى الخلق","أنه يخالف أمر الرسل","كما قال تعالى: ليس كمثله شيء."],
["في أي أمور تكون «الوحدانية» لله تعالى كما ذكر الناظم؟","في الذات والصفات والأفعال","في الذات فقط","في الأفعال فقط","في الأسماء فقط","«وحدانية في الذات أو صفاته العلية والفعل»."],
["ما معنى «الفعل فالتأثير ليس إلا للواحد القهار»؟","أن الله وحده هو المؤثر الحقيقي في الأشياء","أن الأسباب تؤثر بذاتها","أن الإنسان يخلق أفعاله بقدرة مستقلة","أن الطبيعة تفعل بذاتها","لا مؤثر حقيقياً إلا الله."],
["ما حكم من يقول إن الأشياء تؤثر «بالطبع أو بالعلة»؟","كفر عند أهل الملة","بدعة فقط","مباح","جائز عند الضرورة","«ومن يقل بالطبع أو بالعلة فذاك كفر عند أهل الملة»."],
["ما حكم من يقول بـ«القوة المودعة» (أن الله أودع في الأشياء قوة تؤثر بها بنفسها)؟","مبتدع لا يُلتفت إلى قوله","كافر بالإجماع","مصيب","لا حكم عليه","«ومن يقل بالقوة المودعة فذاك بدعي فلا تلتفت»."],
["لو لم يكن الله قديماً متصفاً بالقدم، فماذا يلزم؟","يلزم حدوثه وهو محال","يلزم بقاؤه","يلزم وحدانيته","لا يلزم شيء","«لو لم يكن متصفاً بها لزم حدوثه وهو محال فاستقم»."],
["ما حكم العقل في التسلسل والدور اللذين يلزمان من القول بحدوث الإله؟","مستحيلان","جائزان","واجبان","مقبولان أحياناً","«لأنه يفضي إلى التسلسل والدور وهو المستحيل المنجلي»."]
]},
{t:"المرحلة الثالثة: التنزيه وصفات المعاني السبع",d:"الأبيات 30 – 46",q:[
["أيّ الأسماء الآتية لم يرد في البيت «فهو الجليل والجميل والولي والطاهر القدوس والرب العلي»؟","الجبّار","الجليل","القدوس","الولي","الأسماء الواردة: الجليل، الجميل، الولي، الطاهر، القدوس، الرب العلي."],
["ما معنى تنزيه الله تعالى عن «الحلول»؟","أنه لا يحلّ في شيء من مخلوقاته","أنه لا يعلم الأشياء","أنه لا يتكلم","أنه لا يرى","نفي الحلول: أنه سبحانه لا يحل في مكان ولا في مخلوق."],
["ما معنى تنزيهه تعالى عن «الجهة»؟","أنه ليس في جهة من الجهات ولا يحويه مكان","أنه لا يعلم الجهات","أنه يتجه إلى القبلة","أنه لا يأمر بشيء","المخلوق هو الذي يحتاج إلى جهة ومكان."],
["ما المقصود بتنزيهه عن «الاتصال والانفصال»؟","أنه ليس متصلاً بالعالم ولا منفصلاً عنه كاتصال الأجسام وانفصالها","أنه لا يتصل بعباده بالرحمة","أنه لا يكلّم أحداً","أنه لا يُسمّى","الاتصال والانفصال من صفات الأجسام، وهو منزه عنها."],
["كم عدد صفات المعاني التي ذكرها الناظم؟","سبع","خمس","ثلاث","عشر","«ثم المعاني سبعة»."],
["أيّ الصفات الآتية ليست من صفات المعاني السبع؟","القِدَم","الحياة","الإرادة","السمع","السبع: الحياة، القدرة، الإرادة، العلم، الكلام، السمع، البصر."],
["ماذا يعني وصف علمه تعالى بأنه «المحيط بالأشياء»؟","أنه يحيط بكل شيء ولا يخفى عليه شيء","أنه يعلم الموجودات فقط","أنه يعلم الماضي فقط","أنه يتعلم من الأحداث","علمه شامل لكل معلوم."],
["ما معنى «وكل شيء كائن أراده»؟","أن كل ما يقع في الكون فهو بإرادة الله ومشيئته","أن الله لا يريد إلا الخير","أن الإنسان يريد من غير مشيئة الله","أن بعض الكائنات خارجة عن إرادته","لا يقع في ملكه إلا ما يريد."],
["ما المقصود بقوله «فالقصد غير الأمر فاطرح المِرا»؟","أن الإرادة غير الأمر، فلا تجادل في ذلك","أن الأمر والإرادة شيء واحد","أن الله لا يأمر","أن الجدال واجب","قد يأمر الله بشيء ولا يقع، فالأمر غير الإرادة؛ والمِرا هو الجدال."],
["أمر الله جميع الناس بالإيمان، ومع ذلك كفر بعضهم. ما الذي نستنتجه؟","أن الأمر غير الإرادة، وأن كل ما يقع فهو بإرادته","أن الله عاجز عن إيمان الناس","أن الله لم يأمرهم","أن الكفر خارج عن إرادته","الأمر طلب وتكليف، أما الإرادة فهي التي يقع بها الكائن."],
["أيّ الصفات السبع لا «تعلّق» لها بغيرها؟","الحياة","القدرة","العلم","السمع","«حتماً دواماً ما عدا الحياة»: كل صفات المعاني لها تعلق إلا الحياة."],
["بأي أقسام الحكم العقلي يتعلق العلم والكلام؟","بالواجب والمستحيل والجائز كلها","بالجائز فقط","بالواجب فقط","بالمستحيل فقط","«فالعلم جزماً والكلام السامي تعلقا بسائر الأقسام»."],
["بأي شيء تتعلق القدرة والإرادة؟","بالممكنات (الجائزات) فقط","بالواجبات","بالمستحيلات","بكل شيء حتى المستحيل","«وقدرة إرادة تعلقا بالممكنات كلها أخا التقى»."],
["هل تتعلق قدرة الله بإيجاد المستحيل (كشريك له)؟","لا، لأن القدرة لا تتعلق إلا بالممكنات والمستحيل لا يقبل الوجود","نعم، فالله قادر على كل شيء حتى المستحيل","نعم لكنه لم يرد","لا، لأن الله عاجز","عدم تعلق القدرة بالمستحيل ليس عجزاً بل المستحيل غير قابل للوجود في ذاته."],
["بأي شيء يتعلق السمع والبصر؟","بكل موجود","بالمعدومات","بالمستحيلات فقط","بالأصوات فقط","«واجزم بأن سمعه والبصرا تعلقا بكل موجود يرى»."],
["ما حكم صفات المعاني السبع من حيث القِدَم والحدوث؟","كلها قديمة","كلها حادثة","بعضها قديم وبعضها حادث","قديمة إلا الكلام","«وكلها قديمة بالذات لأنها ليست بغير الذات»."],
["ما معنى «ثم الكلام ليس بالحروف وليس بالترتيب كالمألوف»؟","أن كلامه تعالى ليس مركباً من حروف مرتبة كحال كلام المخلوقين","أن الله لا يتكلم","أن القرآن ليس كلامه","أن الكلام حادث","الحروف والترتيب من صفات الحوادث؛ وكلامه صفة قديمة قائمة بذاته."],
["ما حكم أضداد الصفات الواجبة (كالعجز والجهل والموت)؟","مستحيلة في حقه تعالى","جائزة","واجبة","جائزة أحياناً","«ويستحيل ضد ما تقدما من الصفات الشامخات فاعلما»."],
["ماذا يلزم لو لم يكن الله موصوفاً بالصفات الواجبة؟","أن يتصف بأضدادها وهي نقائص فيلزم الافتقار","أن يصير أكمل","أن يصير قديماً","لا يلزم شيء","«لأنه لو لم يكن موصوفاً بها لكان بالسوى معروفاً»."],
["ما معنى «وكل من قام به سواها فهو الذي في الفقر قد تناهى»، و«الواحد المعبود لا يفتقر»؟","أن من اتصف بغير هذه الصفات الواجبة كان محتاجاً، والإله غني مطلقاً","أن الله فقير","أن الغنى عيب","أن الفقراء أقرب إلى الله","من قامت به النقائص كان في غاية الافتقار فلا يصلح للألوهية؛ والله غني مقتدر."]
]},
{t:"المرحلة الرابعة: الجائز في حقه تعالى والرسل والسمعيات",d:"الأبيات 47 – 58",q:[
["أيّ مما يأتي «جائز» في حق الله تعالى كما ذكر الناظم؟","الإيجاد والترك والإشقاء والإسعاد","النوم والأكل","الجهل والنسيان","الولد والصاحبة","«وجائز في حقه الإيجاد والترك والإشقاء والإسعاد»."],
["ما معنى أن «الإيجاد والترك» جائزان في حقه تعالى؟","أن له أن يوجد الممكن أو يتركه من غير إيجاب عليه","أن عليه إيجاد كل شيء","أن عليه ترك الخلق","أن الخلق خلقوا بلا إرادة","كل الممكنات منوطة بمشيئته."],
["ما معنى أن «الإشقاء والإسعاد» جائزان في حقه تعالى؟","أنه يجعل من يشاء شقياً ومن يشاء سعيداً، ولا يجب عليه شيء","أن عليه أن يسعد الجميع","أن عليه أن يشقي الجميع","أنه لا يملك ذلك","الله فاعل مختار لا يجب عليه شيء."],
["ما حكم من قال: «فعل الصلاح (الأصلح) وجب على الإله»؟","أساء الأدب مع الله","أصاب","قال بقول أهل السنة","لا شيء عليه","«ومن يقل فعل الصلاح وجبا على الإله قد أساء الأدبا»."],
["لماذا يُعد القول بوجوب الأصلح على الله إساءة أدب؟","لأنه يوجب على الله ما لا يجب عليه وهو الفاعل المختار","لأنه يمدح الله","لأن الله لا يفعل الصالح","لأنه لا علاقة له بالأدب","الله لا يجب عليه شيء ولا يُسأل عما يفعل."],
["ما حكم رؤية المؤمنين لربهم في الجنة؟","يجب الجزم بوقوعها","مستحيلة","جائزة لكنها لا تقع","غير مذكورة في الشرع","«واجزم أخي برؤية الإله في جنة الخلد بلا تناهي»."],
["كيف استدل الناظم على رؤية الله في الجنة؟","بأنها جائزة عقلاً وقد ورد بها النقل","بأنها مستحيلة عقلاً لكنها وردت","بالقياس على رؤية الأجسام","بالأحلام","«إذ الوقوع جائز بالعقل وقد أتى به دليل النقل»."],
["أيّ مما يأتي ليس من الصفات الواجبة للرسل المذكورة في الأبيات؟","الشجاعة في القتال","الأمانة","الصدق","التبليغ","الواردة: الأمانة والصدق والتبليغ والفطانة."],
["ما معنى «الأمانة» في حق الرسل؟","حفظ ظاهرهم وباطنهم من المخالفة","أن يحفظوا الأموال فقط","أن يقرضوا الناس","أن لا يتكلموا","الأمانة: عصمتهم من المعاصي والنقائص."],
["ما معنى «الصدق» في حق الرسل؟","مطابقة خبرهم للواقع","أنهم لا يأكلون","أنهم يعلمون الغيب كله","أنهم لا يمرضون","كل ما أخبروا به عن الله حق."],
["ما معنى «التبليغ» في حق الرسل؟","إيصال ما أُمروا بتبليغه للخلق كاملاً","كتمان بعض الوحي","أن يبلغوا سن الأربعين","أن يؤلفوا الكتب","لا يكتمون شيئاً مما أُمروا بتبليغه."],
["ما معنى «الفطانة» في حق الرسل؟","الذكاء الذي يقيمون به الحجة على الخصوم","النسيان","الكسل","البلادة","بها يفحمون المعاندين بالحجة."],
["ما حكم أن يكذب الرسول فيما يبلغه عن الله؟","مستحيل","جائز","واجب","جائز عند الضرورة","«ويستحيل ضدها عليهم»؛ فضد الصدق وهو الكذب مستحيل."],
["ما حكم الأكل والشرب والنوم والمرض (غير المنفّر) في حق الرسل؟","جائز، فهي من الأعراض البشرية التي لا تخل برسالتهم","مستحيل","واجب","محرم عليهم","«وجائز كالأكل في حقهم»."],
["ما حكم إرسال الرسل في حق الله تعالى؟","تفضل ورحمة وليس واجباً عليه","واجب عليه","مستحيل","لازم بالعقل","«إرسالهم تفضل ورحمة للعالمين جل مولي النعمة»."],
["أيّ الأمور الآتية مما أوجب الناظم الإيمان به في البيتين 54 – 55؟","الحساب والحشر والصراط والميزان","علم النجوم","تفسير الأحلام","قراءة الأبراج","«ويلزم الإيمان بالحساب والحشر والعقاب والثواب والنشر والصراط والميزان والحوض والنيران والجنان»."],
["ما الصراط الذي أوجب الناظم الإيمان به؟","جسر ممدود على جهنم يعبره الخلق","نهر في الجنة","اسم لباب الجنة","ميزان الأعمال","من الأمور السمعية الثابتة بالنقل."],
["أيّ المخلوقات الآتية ذُكر وجوب الإيمان بها في البيت 56؟","الجن والملائكة والأنبياء والحور والولدان والأولياء","الأصنام والكهان","الكواكب والأبراج","الأرواح الشريرة فقط","«والجن والأملاك ثم الأنبيا والحور والولدان ثم الأولياء»."],
["ما المقصود بقوله «وكل ما جاء من البشير من كل حكم صار كالضروري»؟","أن ما جاء به النبي ﷺ وعُلم من الدين بالضرورة يجب الإيمان به","أن الأحكام اختيارية","أن العقل يستغني عن الشرع","أن الأحكام كلها مختلف فيها","البشير: النبي ﷺ."],
["كيف تنطوي الأحكام السابقة في «كلمة الإسلام»؟","كلمة الشهادة تتضمن الإيمان بكل ما سبق من الأحكام","لا علاقة بينها وبينها","الكلمة خاصة بالأفعال","الكلمة لا تتضمن شيئاً","«وينطوي في كلمة الإسلام ما قد مضى من سائر الأحكام»."]
]},
{t:"المرحلة الخامسة: الوصايا والسلوك والدعاء والختام",d:"الأبيات 59 – 71",q:[
["ما الذي أمر الناظم بالإكثار من ذكره «بالأدب»؟","كلمة الإسلام (الشهادتان)","أخبار الملوك","الأشعار","الأحلام","«فأكثرن من ذكرها بالأدب»، والضمير يعود إلى كلمة الإسلام."],
["ما ثمرة الإكثار من ذكرها بالأدب؟","الترقي إلى أعلى الرتب","جمع المال","الشهرة","الاستغناء عن الطاعات","«ترقى بهذا الذكر أعلى الرتب»."],
["بماذا أوصى الناظم في قوله «وغلّب الخوف على الرجاء»؟","أن يغلب خوف الله في القلب على الرجاء مع بقاء الرجاء","أن يترك الرجاء كلياً","أن ييأس من الرحمة","أن لا يخاف أبداً","الخوف يمنع من المعصية، ولا يعني ترك الرجاء."],
["ماذا يعني قوله «وسر لمولاك بلا تناء»؟","سر إلى الله بالطاعة دون تباعد أو تأخر","سافر إلى بلاد بعيدة","اترك الناس جميعاً","أبطئ ولا تتعجل","«التناء» هو البعد والتأخر."],
["ماذا يطلب الناظم بقوله «وجدد التوبة للأوزار»؟","أن يتوب العبد من ذنوبه ويجدد التوبة كلما أذنب","أن يتوب مرة واحدة فقط","أن لا يتوب","أن يفاخر بذنوبه","الأوزار: الذنوب."],
["عمّ ينهى الناظم في قوله «لا تيأسن من رحمة الغفار»؟","اليأس من رحمة الله","الاستغفار","الدعاء","الصلاة","الغفار من أسماء الله الحسنى، فلا ييأس العبد من مغفرته."],
["ما معنى «آلاء» في قوله «وكن على آلائه شكورا»؟","نِعَمه","ابتلاءاته","أسماؤه","أوامره","الآلاء: النعم، فالمطلوب الشكر عليها."],
["على أي شيء يوصي الناظم بالصبر؟","على بلائه تعالى","على الراحة","على النوم","على الأكل","«وكن على بلائه صبورا»."],
["ما معنى «وكل شيء بالقضاء والقدر»؟","أن كل ما يقع في الكون بقضاء الله وقدره","أن للإنسان خلق أفعاله باستقلال","أن الأشياء تقع بالمصادفة","أن القدر لا علاقة له بالأفعال","«وكل مقدور فما عنه مفر»."],
["ما ثمرة التسليم لله كما في البيت «فكن له مسلماً كي تسلما»؟","سلامة العبد في دينه وراحة قلبه","الغنى","الشهرة","عدم الابتلاء","من سلّم لله سلم."],
["بسبيل من أمر الناظم أن نتبع؟","الناسكين العلماء","الملوك","التجار","الشعراء","«واتبع سبيل الناسكين العلما»."],
["ماذا تعني «الأغيار» في قوله «وخلص القلب من الأغيار»؟","ما سوى الله تعالى مما يشغل القلب عنه","الأعداء","الأقارب","الجيران","تخليص القلب من التعلق بغير الله."],
["بماذا يُخلَّص القلب من الأغيار حسب البيت؟","بالجد والقيام بالأسحار","بالنوم الكثير","باللهو","بكثرة الكلام","«بالجد والقيام بالأسحار»."],
["ما الذي أوصى به على الدوام في قوله «والفكر والذكر على الدوام»؟","التفكر في عظمة الله وذكره","الجدال","التنافس","جمع الأموال","المداومة على الفكر والذكر."],
["ما معنى «مجتنباً لسائر الآثام»؟","مبتعداً عن كل المعاصي","مرتكباً للصغائر","مجتنباً للصلاة","معرضاً عن الناس","الآثام: الذنوب."],
["ما معنى «مراقباً لله في الأحوال»؟","أن يستحضر العبد اطلاع الله عليه في كل أحواله","أن يراقب الناس","أن ينتظر الجزاء فقط","أن يتجسس على غيره","المراقبة: استحضار اطلاع الله ومعيته."],
["ما ثمرة المراقبة كما في «لترتقي معالم الكمال»؟","الترقي في مراتب الكمال","الكسل","الغفلة","الكبر","المراقبة طريق الكمال."],
["بماذا دعا الناظم في قوله «رب لا تقطعني عنك بقاطع ولا تحرمني من سرك الأبهى»؟","أن لا يقطعه عن ربه شيء وأن لا يحرمه من نور معرفته","أن يعطيه مالاً","أن يطيل عمره","أن يمنحه شهرة","طلب الوصل بالله والحفظ من القواطع."],
["ما معنى «واختم بخير يا رحيم الرحما»؟","طلب حسن الخاتمة من الله","طلب الرزق","طلب الصحة","طلب الشفاء","دعاء بأن يُختم له بخير."],
["بأي وصفين وصف الناظم النبي ﷺ في آخر الأبيات؟","الهاشمي الخاتم","القرشي الأمي","المدني الحاكم","التهامي العلي","«على النبي الهاشمي الخاتم وآله وصحبه الأكارم»."]
]},
{t:"المرحلة السادسة: الفهم الشامل والتطبيق",d:"أسئلة تربط بين أبواب القصيدة",q:[
["كم صفة واجبة صرّح بها الناظم في أبياته (النفسية والسلبية والمعاني)؟","ثلاث عشرة صفة","عشر صفات","عشرون صفة","سبع صفات","نفسية واحدة + سلبية خمس + معانٍ سبع = 13."],

var PASS=14, KEY="kharida_quiz_v1";
var $=function(i){return document.getElementById(i)};
var prog={best:[],all:false,name:""};
try{var s=localStorage.getItem(KEY);if(s)prog=JSON.parse(s)}catch(e){}
function getName(){return ($("pname").value||"").trim()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(prog))}catch(e){}}
function show(id){["home","quiz","result"].forEach(function(x){$(x).classList.toggle("hide",x!==id)});window.scrollTo(0,0)}
function unlocked(i){return prog.all||i===0||(prog.best[i-1]||0)>=PASS}

function home(){
  var box=$("stages");box.innerHTML="";
  STAGES.forEach(function(st,i){
    var ok=unlocked(i);
    var d=document.createElement("div");d.className="card stage"+(ok?"":" locked");
    var n=document.createElement("div");n.className="num";n.textContent=ok?(i+1):"🔒";
    var m=document.createElement("div");
    var h=document.createElement("h3");h.textContent=st.t;
    var sm=document.createElement("small");sm.textContent=st.d+" — 20 سؤالاً";
    m.appendChild(h);m.appendChild(sm);
    var b=document.createElement("div");b.className="best";
    b.textContent=(prog.best[i]!=null)?("أفضل نتيجة\n"+prog.best[i]+"/20"):"";
    b.style.whiteSpace="pre-line";
    d.appendChild(n);d.appendChild(m);d.appendChild(b);
    if(ok)d.onclick=function(){if(!getName()){alert("من فضلك اكتب اسمك أولاً");$("pname").focus();return}start(i)};
    box.appendChild(d);
  });
  show("home");
}

function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

var cur,idx,score,wrong,answered;
function start(si){
  prog.name=getName();save();
  cur=si;idx=0;score=0;wrong=[];
  show("quiz");render();
}
function render(){
  var st=STAGES[cur],q=st.q[idx];
  answered=false;
  $("qStage").textContent=st.t.split(":")[0];
  $("qCount").textContent="السؤال "+(idx+1)+" من "+st.q.length;
  $("bar").style.width=(idx/st.q.length*100)+"%";
  $("qText").textContent=q[0];
  $("exp").classList.add("hide");$("next").classList.add("hide");
  var letters=["أ","ب","ج","د"];
  var opts=shuf([q[1],q[2],q[3],q[4]]);
  var box=$("opts");box.innerHTML="";
  opts.forEach(function(o,k){
    var b=document.createElement("button");b.className="opt";b.textContent=letters[k]+") "+o;
    b.onclick=function(){pick(b,o,opts)};
    box.appendChild(b);
  });
}
function pick(btn,o,opts){
  if(answered)return;answered=true;
  var q=STAGES[cur].q[idx];
  var btns=$("opts").children;
  for(var k=0;k<btns.length;k++){
    btns[k].disabled=true;
    if(opts[k]===q[1])btns[k].classList.add("ok");
  }
  if(o===q[1]){score++}else{btn.classList.add("bad");wrong.push({q:q[0],mine:o,right:q[1],e:q[5]})}
  $("exp").textContent=q[5];$("exp").classList.remove("hide");
  var last=idx===STAGES[cur].q.length-1;
  $("next").textContent=last?"عرض النتيجة":"التالي";
  $("next").classList.remove("hide");
}
$("next").onclick=function(){
  if(idx<STAGES[cur].q.length-1){idx++;render()}else finish();
};
$("quit").onclick=function(){if(confirm("هل تريد الخروج من المرحلة؟"))home()};

function finish(){
  var n=STAGES[cur].q.length;
  if(prog.best[cur]==null||score>prog.best[cur]){prog.best[cur]=score;save()}
  $("rWho").textContent="الطالب: "+prog.name;
  $("rTitle").textContent=STAGES[cur].t.split(":")[0];
  $("rScore").textContent=score+" / "+n;
  var pass=score>=PASS;
  var msg=score===n?"ما شاء الله! فهمٌ كامل لهذه المرحلة.":pass?"أحسنت! اجتزت المرحلة.":"حاول مرة أخرى؛ راجع الأبيات ثم أعد المحاولة. يلزم "+PASS+" على الأقل.";
  if(pass&&cur<STAGES.length-1)msg+=" فُتحت المرحلة التالية.";
  $("rMsg").textContent=msg;
  var bt=$("rBtns");bt.innerHTML="";
  var again=document.createElement("button");again.textContent="إعادة المرحلة";again.onclick=function(){start(cur)};bt.appendChild(again);
  if(pass&&cur<STAGES.length-1){var nx=document.createElement("button");nx.textContent="المرحلة التالية";nx.onclick=function(){start(cur+1)};bt.appendChild(nx)}
  var wa=document.createElement("button");wa.className="wa";wa.textContent="إرسال النتيجة عبر واتساب";
  wa.onclick=function(){
    var txt="مسابقة الخريدة البهية\nالطالب: "+prog.name+"\n"+STAGES[cur].t.split(":")[0]+"\nالنتيجة: "+score+" من "+n+(pass?" (ناجح)":" (لم يجتز بعد)")+"\nإعداد وبرمجة وائل دهشان";
    window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank");
  };
  bt.appendChild(wa);
  var hm=document.createElement("button");hm.className="sec";hm.textContent="الرئيسية";hm.onclick=home;bt.appendChild(hm);
  var rv=$("rv");rv.innerHTML="";
  wrong.forEach(function(w){
    var d=document.createElement("div");d.className="rev";
    var a=document.createElement("div");a.textContent=w.q;a.style.fontWeight="bold";
    var b=document.createElement("div");var bb=document.createElement("b");bb.textContent="إجابتك: ";b.appendChild(bb);b.appendChild(document.createTextNode(w.mine));
    var c=document.createElement("div");var cs=document.createElement("span");cs.textContent="الصواب: ";c.appendChild(cs);c.appendChild(document.createTextNode(w.right));
    var e=document.createElement("div");e.style.color="#7a7468";e.textContent=w.e;
    d.appendChild(a);d.appendChild(b);d.appendChild(c);d.appendChild(e);rv.appendChild(d);
  });
  $("rvCard").classList.toggle("hide",wrong.length===0);
  show("result");
}
$("unlockAll").onclick=function(){prog.all=true;save();home()};
$("resetAll").onclick=function(){if(confirm("مسح جميع النتائج؟")){prog={best:[],all:false};save();home()}};
$("pname").value=prog.name||"";
$("pname").addEventListener("input",function(){prog.name=getName();save()});
home();
</script>
</body>
</html>
